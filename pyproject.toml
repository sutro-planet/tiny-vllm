[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-vllm"
version = "0.1.0"
description = "A small learning-oriented LLM inference framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "aiohttp>=3.10,<4",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]
transformers = [
    "torch>=2.4",
    "transformers>=4.44",
]
server = [
    "aiohttp>=3.10,<4",
]

[project.scripts]
tiny-vllm-serve = "tiny_vllm.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = "tiny_vllm.torch_gpt2"
disable_error_code = ["misc"]
