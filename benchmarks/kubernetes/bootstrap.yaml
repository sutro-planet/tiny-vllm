apiVersion: v1
kind: Namespace
metadata:
  name: tiny-vllm-profile
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: profiler
  namespace: tiny-vllm-profile
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: profiler
  namespace: tiny-vllm-profile
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec, services, events, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: profiler
  namespace: tiny-vllm-profile
subjects:
  - kind: ServiceAccount
    name: profiler
    namespace: tiny-vllm-profile
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: profiler
